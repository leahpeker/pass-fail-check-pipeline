[project]
name = "index-checks"
version = "0.1.0"
description = "Flag significant day-over-day and week-over-week moves in US index closes"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyyaml>=6.0"]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
